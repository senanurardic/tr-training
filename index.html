<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Location-Sharing App</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link href="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Schermata di caricamento iniziale -->
<div id="experiment-flow-screen">
    <!-- Passo 1: Connessione in corso -->
    <div id="step-connecting" class="flow-step">
        <div class="spinner"></div>
        <p class="flow-text">Connessione in corso...</p>
    </div>
</div>

<!-- Contenitore della mappa (il titolo e l'interfaccia vengono aggiunti dinamicamente tramite JS) -->
<div id="container">
    <div id="map"></div>
</div>

<script src="script.js"></script>
</body>
</html>
